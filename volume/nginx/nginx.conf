worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket connection handling
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Diagnostic access log for upstream redirects
    log_format upstream_debug
        'request="$request" uri="$uri" host="$host" '
        'status=$status upstream_status=$upstream_status '
        'upstream_addr=$upstream_addr '
        'upstream_location="$upstream_http_location" '
        'sent_location="$sent_http_location"';

    # HTTP to HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        
        return 301 https://$host$request_uri;
    }

    # HTTPS reverse proxy
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl;
        server_name _;

        access_log /var/log/nginx/upstream_debug.log upstream_debug;
        error_log  /var/log/nginx/error.log warn;

        # SSL certificates supplied by the existing container setup
        ssl_certificate     /etc/nginx/certs/${OE_NGINX_CERT};
        ssl_certificate_key /etc/nginx/keys/${OE_NGINX_KEY};

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Common proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  443;

        # Do not let Nginx generate absolute redirects with the wrong host
        absolute_redirect off;

        # --------------------------------------------------
        # OpenELIS application
        # Public URL: /api/OpenELIS-Global/
        # Backend URL: /OpenELIS-Global/
        # --------------------------------------------------
        location /api/OpenELIS-Global/ {
            proxy_pass https://openelisglobal-webapp:8443/OpenELIS-Global/;

            proxy_ssl_verify off;
            proxy_ssl_server_name on;

            # Rewrite backend redirects to the public application path
            proxy_redirect
                ~^https?://[^/]+/OpenELIS-Global/(.*)$
                /api/OpenELIS-Global/$1;

            # Rewrite the Tomcat session cookie path so the browser
            # sends JSESSIONID to the public application URL.
            proxy_cookie_path
                /OpenELIS-Global
                /api/OpenELIS-Global;
        }

        # --------------------------------------------------
        # General API gateway
        # --------------------------------------------------
        location /api/ {
            proxy_pass https://oe.openelis.org:8443/api/;

            proxy_ssl_verify off;
            proxy_ssl_server_name on;

            proxy_redirect off;

            # Keep cookies scoped to the general API path.
            # The more-specific OpenELIS-Global location above
            # has its own cookie-path rule.
            proxy_cookie_path /OpenELIS-Global/ /;
            proxy_cookie_path /OpenELIS-Global  /;
        }

        # --------------------------------------------------
        # OpenELIS REST endpoints
        # --------------------------------------------------
        location /rest/ {
            proxy_pass https://oe.openelis.org:8443/rest/;

            proxy_ssl_verify off;
            proxy_ssl_server_name on;

            proxy_redirect off;

            proxy_cookie_path /OpenELIS-Global/ /;
            proxy_cookie_path /OpenELIS-Global  /;
        }

        # FDA LIMS Dashboard (static HTML)
        location = / {
            root /usr/share/nginx/html;
            try_files /static/dashboard.html =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location = /dashboard {
            return 302 /;
        }

        location = /Dashboard {
            return 302 /;
        }

        # --------------------------------------------------
        # React frontend
        # --------------------------------------------------
        location / {
            proxy_pass http://frontend.openelis.org;

            proxy_http_version 1.1;
            proxy_redirect off;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port  443;

            # WebSocket support
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}