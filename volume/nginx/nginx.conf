worker_processes 1;
events { worker_connections 1024; }

http {
    # Preserve WebSocket upgrades
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Resolve Docker service aliases dynamically
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP server — handles ACME challenges and redirects to HTTPS
    server {
        listen 80;
        server_name ${LETSENCRYPT_DOMAIN} ${LETSENCRYPT_BRIDGE_DOMAIN};
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Catch-all HTTP redirect for other domains
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS server for configured domain
    server {
        listen 443 ssl;
        server_name ${LETSENCRYPT_DOMAIN};

        ssl_certificate /etc/nginx/certs/apache-selfsigned.crt;
        ssl_certificate_key /etc/nginx/keys/apache-selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Proxy headers
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        absolute_redirect off;

        # --- FDA LIMS Static Dashboard Routes ---
        # Allows you to serve your custom dashboard cleanly from Nginx
        location = /dashboard {
            root  /usr/share/nginx/html;
            try_files /static/dashboard.html =404;
            add_header Cache-Control "no-cache";
        }
        location = /Dashboard {
            root  /usr/share/nginx/html;
            try_files /static/dashboard.html =404;
            add_header Cache-Control "no-cache";
        }

        # --- Automatic Transparent Placeholder for the FDA Logo ---
        # Stops the React application from hanging when fda-logo.png is missing
        location = /api/OpenELIS-Global/branding/fda-logo.png {
            empty_gif;
            access_log off;
        }

        # Frontend (Vite UI container)
        location / {
            set $frontend_upstream "frontend.openelis.org";
            proxy_pass http://$frontend_upstream;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Host localhost;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Backend API
        # Strips '/api' and translates session cookies so logins stick
        location /api/OpenELIS-Global/ {
            set $oe_upstream "oe.openelis.org";
            proxy_pass         https://$oe_upstream:8443/OpenELIS-Global/;
            proxy_redirect     off;
            proxy_ssl_verify   off;
            proxy_ssl_server_name on;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $http_host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cookie_path  /OpenELIS-Global /;
            proxy_cookie_path  /OpenELIS-Global/ /;
        }

        # Fallback API
        location /api/ {
            set $oe_upstream "oe.openelis.org";
            proxy_pass https://$oe_upstream:8443;
            proxy_redirect off;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_cookie_path  /OpenELIS-Global /;
            proxy_cookie_path  /OpenELIS-Global/ /;
        }

        # REST API
        location /rest/ {
            set $oe_upstream "oe.openelis.org";
            proxy_pass https://$oe_upstream:8443;
            proxy_redirect off;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_cookie_path  /OpenELIS-Global /;
            proxy_cookie_path  /OpenELIS-Global/ /;
        }
    }

    # Bridge admin upload UI (analyzer file drop)
    server {
        listen 443 ssl;
        server_name ${LETSENCRYPT_BRIDGE_DOMAIN};
        ssl_certificate /etc/nginx/certs/apache-selfsigned.crt;
        ssl_certificate_key /etc/nginx/keys/apache-selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        location = / { return 301 /admin/upload/index.html; }
        location = /admin/upload/ { return 301 /admin/upload/index.html; }
        location = /admin/upload { return 301 /admin/upload/index.html; }

        location / {
            set $bridge_upstream "bridge.openelis.org";
            proxy_pass https://$bridge_upstream:8443;
            proxy_redirect off;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 32m;
        }
    }
}
