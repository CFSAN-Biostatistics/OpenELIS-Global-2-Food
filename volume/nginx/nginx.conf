worker_processes 1;
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP Redirect to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server
    server {
        listen [::]:443 ssl;
        listen 443 ssl default_server;
        server_name _;

        # Exact SSL paths from your working setup
        ssl_certificate     /etc/nginx/certs/${OE_NGINX_CERT};
        ssl_certificate_key /etc/nginx/keys/${OE_NGINX_KEY};

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        absolute_redirect off;

        # FDA LIMS Dashboard (static HTML)
        location = /dashboard {
            root  /usr/share/nginx/html;
            try_files /static/dashboard.html =404;
            add_header Cache-Control "no-cache";
        }

        location = /Dashboard {
            root  /usr/share/nginx/html;
            try_files /static/dashboard.html =404;
            add_header Cache-Control "no-cache";
        }

        # FDA Logo placeholder
        location = /api/OpenELIS-Global/branding/fda-logo.png {
            empty_gif;
            access_log off;
        }

        # Fallback /api/
        location /api/ {
            set $oe_upstream "oe.openelis.org";
            
            # Rewrite /api/OpenELIS-Global/... to /OpenELIS-Global/...
            # Rewrite /api/some_endpoint to /some_endpoint
            rewrite ^/api/(.*) /$1 break;

            proxy_pass         https://$oe_upstream:8443;
            proxy_redirect     off;
            proxy_ssl_verify   off;
            proxy_ssl_server_name on;

            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $http_host;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Translates Tomcat's cookies to the root domain so logins stick
            proxy_cookie_path  /OpenELIS-Global /;
            proxy_cookie_path  /OpenELIS-Global/ /;
        }

        # REST endpoints
        location /rest/ {
            set $oe_upstream "oe.openelis.org";
            proxy_pass         https://$oe_upstream:8443/rest/;
            proxy_redirect     off;
            proxy_ssl_verify   off;
            proxy_ssl_server_name on;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $http_host;
            proxy_cookie_path  /OpenELIS-Global /;
            proxy_cookie_path  /OpenELIS-Global/ /;
        }

        # React Frontend (single catch-all for all UI routes)
        location / {
            set $frontend_upstream "frontend.openelis.org";
            proxy_pass         http://$frontend_upstream;
            proxy_redirect     off;
            proxy_http_version 1.1;
            proxy_set_header   Host localhost;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
        }
    }
}
