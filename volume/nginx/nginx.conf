worker_processes 1;

events { 
    worker_connections 1024; 
}

http {
    # HTTP to HTTPS Redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Secure HTTPS Server
    server {
        listen [::]:443 ssl;
        listen 443 ssl default;
        server_name _;

        ssl_certificate /etc/nginx/certs/${OE_NGINX_CERT};
        ssl_certificate_key /etc/nginx/keys/${OE_NGINX_KEY};

        # Global Proxy Headers
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        absolute_redirect off;

        # --- FDA LIMS Dashboard (static HTML) ---
        location = / {
            root  /usr/share/nginx/html;
            try_files /static/dashboard.html =404;
            add_header Cache-Control "no-cache";
        }

        location = /dashboard {
            root  /usr/share/nginx/html;
            try_files /static/dashboard.html =404;
            add_header Cache-Control "no-cache";
        }

        location = /Dashboard {
            root  /usr/share/nginx/html;
            try_files /static/dashboard.html =404;
            add_header Cache-Control "no-cache";
        }

        # --- React Frontend Routes ---
        # Proxies directly to the internal Docker service key 'frontend.openelis.org'
        location = /login                        { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /order                       { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /LogbookResults              { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /ResultValidation            { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /WorkPlanByTest              { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /WorkPlanByPanel             { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /WorkPlanByTestSection       { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /WorkPlanByPriority          { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /NceDashboard                { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /ReportNonConformingEvent    { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /ViewNonConformingEvent      { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /NCECorrectiveAction         { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /RoutineReports              { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /StudyReports                { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /AuditTrailReport            { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /TATReport                   { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /Storage                     { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /FreezerMonitoring           { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /analyzers                   { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /MasterListsPage             { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /SampleShipment              { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /AccessionResults            { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /AccessionValidation         { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /PatientResults              { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /Alerts                      { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /inventory                   { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /NotebookDashboard           { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /GenericSample               { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /SampleManagement            { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /result                      { proxy_pass http://frontend.openelis.org; proxy_redirect off; }
        location ^~ /validation                  { proxy_pass http://frontend.openelis.org; proxy_redirect off; }

        # --- Automatic Transparent Placeholder for the FDA Logo ---
        # Prevents the React application from hanging when fda-logo.png is missing
        location = /api/OpenELIS-Global/branding/fda-logo.png {
            empty_gif;
            access_log off;
        }

        # --- OpenELIS API Backend Routes ---
        # Strips /api and routes directly to Tomcat container context path on service 'oe.openelis.org'
        location /api/OpenELIS-Global/ {
            proxy_pass         https://oe.openelis.org:8443/OpenELIS-Global/;
            proxy_redirect     off;
            proxy_ssl_verify   off; # Stops SSL Handshake failure errors
        }

        # Catch-all for any other generic /api/ calls routing to Tomcat
        location /api/ {
            proxy_pass         https://oe.openelis.org:8443/;
            proxy_redirect     off;
            proxy_ssl_verify   off;
        }

        # OpenELIS REST endpoints - routing to Tomcat container
        location /rest/ {
            proxy_pass         https://oe.openelis.org:8443/rest/;
            proxy_redirect     off;
            proxy_ssl_verify   off;
        }

        # React Frontend Catch-all (Default route)
        location / {
            proxy_pass http://frontend.openelis.org;
            proxy_redirect off;
        }
    }
}
