name: Build and Publish Backend

on:
  push:
    branches: [food-env]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'dataexport/**'
      - 'plugins/**'
      - 'fhir/**'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build + Publish Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache local Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build dataexport submodule
        run: |
          cd dataexport
          mvn clean install
          cd ..

      - name: Build main project
        run: mvn clean install -DskipTests -Dspotless.check.skip=true

      - name: Authenticate to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        run: |
          docker build -t quay.io/galaxytrakr/openelis-backend-food:latest .
          docker push quay.io/galaxytrakr/openelis-backend-food:latest
